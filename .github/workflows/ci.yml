name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Format check with black
        run: |
          pip install black
          black --check src/

      - name: Build Docker image
        run: docker build -t autocare360-chatbot .

      - name: Test Docker image startup
        run: |
          docker run --rm -d --name test-chatbot -p 8000:8000 autocare360-chatbot
          sleep 10
          # Test if the application is responding
          docker exec test-chatbot curl -f http://localhost:8000/health || exit 1
          docker stop test-chatbot